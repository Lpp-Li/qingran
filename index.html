  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/home" aria-label="轻燃首页">
        <span class="brand-mark">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <circle cx="20" cy="20" r="19" fill="none" stroke="currentColor" stroke-opacity=".22"/>
            <path d="M20 31c5.4 0 9-3.7 9-8.8 0-4.2-2.8-7.2-5.1-10C21.9 9.6 21 7.3 21.2 5c-3.5 1.7-7 5.5-7 9.7 0 2 .8 3.7 1.9 4.7-.6-2.4.3-4.4 1.9-5.8-.2 3.1 2.1 4.5 3.5 6.8.8 1.3 1.1 2.5 1.1 3.7 0 1.9-1.2 3.2-2.6 3.9" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <span class="brand-type"><strong>轻燃</strong><small>QINGRAN</small></span>
      </a>

      <div class="sidebar-section-label">我的空间</div>
      <nav class="nav" aria-label="主导航">
        <a href="#/home" class="nav-item" data-route="home">
          <svg class="icon"><use href="#i-home"/></svg><span>首页总览</span><em class="nav-dot"></em>
        </a>
        <a href="#/food" class="nav-item" data-route="food">
          <svg class="icon"><use href="#i-bowl"/></svg><span>今日饮食</span><em class="nav-dot"></em>
        </a>
        <a href="#/plan" class="nav-item" data-route="plan">
          <svg class="icon"><use href="#i-plan"/></svg><span>饮食计划</span><em class="nav-dot"></em>
        </a>
        <a href="#/library" class="nav-item" data-route="library">
          <svg class="icon"><use href="#i-grid"/></svg><span>食物分类</span><em class="nav-dot"></em>
        </a>
        <a href="#/data" class="nav-item" data-route="data">
          <svg class="icon"><use href="#i-chart"/></svg><span>数据与设置</span><em class="nav-dot"></em>
        </a>
      </nav>

      <div class="sidebar-foot">
        <div class="local-note">
          <span class="local-note-icon"><svg class="icon"><use href="#i-lock"/></svg></span>
          <div><strong>只属于这台电脑</strong><small>数据本地保存，不会上传</small></div>
        </div>
        <button class="profile-chip" id="sidebarProfile" type="button" aria-label="查看个人资料">
          <span class="avatar" id="avatarInitial">轻</span>
          <span class="profile-meta"><strong id="profileName">我的轻燃</strong><small id="profileGoal">正在建立目标</small></span>
          <svg class="icon profile-arrow"><use href="#i-chevron-right"/></svg>
        </button>
      </div>
    </aside>

    <div class="main-shell">
      <header class="topbar">
        <div class="topbar-left">
          <span class="topbar-date" id="topbarDate"></span>
          <span class="save-pill" id="savePill"><span class="save-dot"></span><span>本地已保存</span></span>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-ghost btn-sm topbar-memo" id="topbarMemo" type="button">
            <svg class="icon"><use href="#i-pin"/></svg><span>随手记</span>
          </button>
          <button class="btn btn-primary btn-sm" id="globalAddFood" type="button">
            <svg class="icon"><use href="#i-plus"/></svg><span>记录饮食</span><kbd>N</kbd>
          </button>
          <button class="icon-btn" id="topSettings" type="button" aria-label="打开设置">
            <svg class="icon"><use href="#i-settings"/></svg>
          </button>
        </div>
      </header>

      <main class="app-main" id="appMain" tabindex="-1"></main>
    </div>
  </div>

  <div id="overlayRoot"></div>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <div id="onboardingRoot"></div>
  <div id="pwaInstallRoot"></div>

  <script src="data.js"></script>
  <script src="core.js"></script>
  <script src="views.js"></script>
  <script src="app.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
